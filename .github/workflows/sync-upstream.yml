name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: crossplane-contrib/function-go-templating
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/${{ env.UPSTREAM_BRANCH }})
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream"
            exit 0
          fi

          echo "Fork is $BEHIND commits behind upstream"

          # Get upstream version info
          UPSTREAM_HEAD=$(git rev-parse --short upstream/${{ env.UPSTREAM_BRANCH }})
          echo "upstream_head=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT

          # Check for new tags
          LATEST_UPSTREAM_TAG=$(git tag -l 'v*' --sort=-version:refname --merged upstream/${{ env.UPSTREAM_BRANCH }} | head -1)
          echo "latest_upstream_tag=$LATEST_UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Create sync branch
        if: steps.check.outputs.behind > 0
        id: branch
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Capture pre-merge HEAD for later comparison
          echo "pre_merge_head=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          # Delete existing sync branch if it exists
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          # Create new branch from main
          git checkout -b "$BRANCH_NAME"

      - name: Attempt merge
        if: steps.check.outputs.behind > 0
        id: merge
        run: |
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            # List conflicting files for the PR body
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflict_files=$CONFLICT_FILES" >> $GITHUB_OUTPUT
            # Stage conflict markers so we can push and create draft PR
            git add -A
            git commit -m "DO NOT MERGE - contains conflict markers

            This commit contains unresolved merge conflicts with markers:
            <<<<<<< HEAD
            =======
            >>>>>>> upstream/main

            Files with conflicts: $CONFLICT_FILES

            Resolve conflicts locally before merging." || true
          fi

      - name: Analyze changes
        if: steps.check.outputs.behind > 0
        id: analyze
        env:
          PRE_MERGE_HEAD: ${{ steps.branch.outputs.pre_merge_head }}
        run: |
          # Check if go.mod changed (comparing pre-merge state to upstream)
          if git diff "$PRE_MERGE_HEAD" upstream/${{ env.UPSTREAM_BRANCH }} --name-only | grep -q "^go.mod$"; then
            echo "gomod_changed=true" >> $GITHUB_OUTPUT

            # Check if sprig version changed in upstream
            if git diff "$PRE_MERGE_HEAD" upstream/${{ env.UPSTREAM_BRANCH }} -- go.mod | grep -q "Masterminds/sprig"; then
              echo "sprig_changed=true" >> $GITHUB_OUTPUT
            else
              echo "sprig_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "gomod_changed=false" >> $GITHUB_OUTPUT
            echo "sprig_changed=false" >> $GITHUB_OUTPUT
          fi

          # Check if CI workflow changed
          if git diff "$PRE_MERGE_HEAD" upstream/${{ env.UPSTREAM_BRANCH }} --name-only | grep -q "^.github/workflows/ci.yml$"; then
            echo "ci_changed=true" >> $GITHUB_OUTPUT
          else
            echo "ci_changed=false" >> $GITHUB_OUTPUT
          fi

          # Get commit summary (commits in upstream that weren't in our fork)
          COMMIT_SUMMARY=$(git log --oneline "$PRE_MERGE_HEAD..upstream/${{ env.UPSTREAM_BRANCH }}" | head -20)
          echo "commit_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push sync branch
        if: steps.check.outputs.behind > 0
        run: |
          git push -u origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        if: steps.check.outputs.behind > 0
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.check.outputs.behind }}';
            const upstreamHead = '${{ steps.check.outputs.upstream_head }}';
            const latestTag = '${{ steps.check.outputs.latest_upstream_tag }}';
            const mergeStatus = '${{ steps.merge.outputs.status }}';
            const gomodChanged = '${{ steps.analyze.outputs.gomod_changed }}' === 'true';
            const sprigChanged = '${{ steps.analyze.outputs.sprig_changed }}' === 'true';
            const ciChanged = '${{ steps.analyze.outputs.ci_changed }}' === 'true';
            const commitSummary = `${{ steps.analyze.outputs.commit_summary }}`;
            const conflictFiles = '${{ steps.merge.outputs.conflict_files }}';

            const isDraft = mergeStatus === 'conflict';

            // Build checklist based on what changed
            let checklist = `## Review Checklist

            ### Automated Checks
            - [ ] All CI tests pass
            - [ ] No merge conflicts (or resolved manually)

            ### Manual Review`;

            if (gomodChanged) {
              checklist += `
            - [ ] **go.mod changes reviewed** - Verify the \`replace\` directive for sprig is intact`;
            }

            if (sprigChanged) {
              checklist += `
            - [ ] **⚠️ Sprig dependency changed upstream** - Check if [dennispidun/sprig](https://github.com/dennispidun/sprig) needs rebasing onto new version`;
            }

            if (ciChanged) {
              checklist += `
            - [ ] **CI workflow changed** - Verify GHCR push changes weren't overwritten`;
            }

            checklist += `
            - [ ] No breaking changes in upstream commits
            - [ ] uuidv7 functionality still works (tests cover this)

            ### Post-Merge
            - [ ] Tag new release (e.g., \`${latestTag || 'vX.Y.Z'}-io41.N\`)
            - [ ] Update consuming projects if needed`;

            // Build warnings section
            let warnings = '';
            if (mergeStatus === 'conflict') {
              warnings += `
            ## 🚨 DO NOT MERGE - Contains Conflict Markers

            This PR contains **raw git conflict markers** (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`) that must be resolved before merging.

            **Files with conflicts:** \`${conflictFiles || 'unknown'}\`

            ### How to resolve:
            \`\`\`bash
            git fetch origin ${{ steps.branch.outputs.branch_name }}
            git checkout ${{ steps.branch.outputs.branch_name }}

            # Reset the merge and redo it locally
            git reset --hard HEAD~1
            git merge upstream/${{ env.UPSTREAM_BRANCH }}

            # Resolve conflicts in your editor, then:
            git add .
            git commit -m "Merge upstream with resolved conflicts"
            git push --force-with-lease
            \`\`\`
            `;
            }

            if (sprigChanged) {
              warnings += `
            ## ⚠️ Sprig Dependency Changed

            Upstream updated the Masterminds/sprig dependency. Since this fork uses a custom sprig fork (dennispidun/sprig) for uuidv7 support, you need to verify compatibility:

            1. Check what version upstream now uses
            2. Verify dennispidun/sprig is rebased onto that version
            3. Update the \`replace\` directive in go.mod if needed
            4. Run \`go mod tidy\` and test
            `;
            }

            const body = `## Upstream Sync

            Syncing ${behind} commits from [${process.env.UPSTREAM_REPO}](https://github.com/${process.env.UPSTREAM_REPO}).

            **Upstream HEAD:** \`${upstreamHead}\`
            **Latest upstream tag:** \`${latestTag || 'none'}\`

            ${warnings}

            <details>
            <summary>Commits from upstream</summary>

            \`\`\`
            ${commitSummary}
            \`\`\`

            </details>

            ${checklist}

            ---
            *This PR was automatically created by the sync-upstream workflow.*`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync upstream (${behind} commits)${latestTag ? ` - includes ${latestTag}` : ''}`,
              head: '${{ steps.branch.outputs.branch_name }}',
              base: 'main',
              body: body,
              draft: isDraft
            });

            console.log(`Created PR #${pr.data.number}: ${pr.data.html_url}`);

            // Add labels
            const labels = ['upstream-sync'];
            if (sprigChanged) labels.push('sprig-review-needed');
            if (mergeStatus === 'conflict') labels.push('has-conflicts');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: labels
            });
